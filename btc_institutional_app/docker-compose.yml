services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - ./web:/usr/share/nginx/html:ro

  api:
    build:
      context: ./api
    env_file:
      - ./.env
    environment:
      APP_ENV: ${APP_ENV:-production}
      DATABASE_URL: ${DATABASE_URL:-postgresql://btc_user:btc_pass@postgres:5432/btc_app}
      EXECUTION_ENABLED: ${EXECUTION_ENABLED:-false}
      GATE_MIN_SAMPLE: ${GATE_MIN_SAMPLE:-30}
      GATE_MIN_PROFIT_FACTOR: ${GATE_MIN_PROFIT_FACTOR:-1.2}
      GATE_MAX_DRAWDOWN_PCT: ${GATE_MAX_DRAWDOWN_PCT:-6.0}
      GATE_MIN_WINRATE: ${GATE_MIN_WINRATE:-0.45}
    depends_on:
      - postgres
    expose:
      - "8000"

  worker:
    build:
      context: ./worker
    env_file:
      - ./.env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://btc_user:btc_pass@postgres:5432/btc_app}
      EXECUTION_ENABLED: ${EXECUTION_ENABLED:-false}
    depends_on:
      - postgres
      - api

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-btc_app}
      POSTGRES_USER: ${POSTGRES_USER:-btc_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-btc_pass}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

volumes:
  pgdata:

# PostgreSQL configuration for Calvin AI Development Environment
# Optimized for TimescaleDB and time-series trading data

# =============================================================================
# CONNECTION AND AUTHENTICATION
# =============================================================================

listen_addresses = '*'
port = 5432
max_connections = 100

# Authentication
ssl = off
password_encryption = md5

# =============================================================================
# MEMORY SETTINGS
# =============================================================================

# Memory allocation (conservative for development)
shared_buffers = 256MB              # 25% of available RAM (assuming 1GB container)
effective_cache_size = 512MB        # 50% of available RAM
work_mem = 16MB                     # Per operation memory
maintenance_work_mem = 128MB        # For maintenance operations

# =============================================================================
# TIMESCALEDB SETTINGS
# =============================================================================

# Enable TimescaleDB extension
shared_preload_libraries = 'timescaledb'

# TimescaleDB specific settings
timescaledb.max_background_workers = 4
max_worker_processes = 8

# =============================================================================
# WRITE AHEAD LOG (WAL) SETTINGS
# =============================================================================

# WAL settings for replication support
wal_level = replica
max_wal_senders = 3
wal_keep_size = 256MB
hot_standby = on

# WAL archiving (disabled for dev)
archive_mode = off

# =============================================================================
# QUERY PERFORMANCE
# =============================================================================

# Query performance tuning
random_page_cost = 1.1              # SSD storage assumption
effective_io_concurrency = 200      # Concurrent I/O operations
seq_page_cost = 1.0

# Planner settings
default_statistics_target = 100
constraint_exclusion = partition

# =============================================================================
# LOGGING
# =============================================================================

# Logging configuration
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 10MB
log_truncate_on_rotation = on

# What to log
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_statement = 'mod'               # Log all DDL and DML statements
log_temp_files = 0

# Log slow queries (anything over 1 second)
log_min_duration_statement = 1000

# =============================================================================
# AUTOVACUUM SETTINGS
# =============================================================================

# Autovacuum tuning for time-series data
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 30s

# Vacuum settings
autovacuum_vacuum_scale_factor = 0.1
autovacuum_analyze_scale_factor = 0.05
autovacuum_vacuum_cost_delay = 10ms
autovacuum_vacuum_cost_limit = 1000

# =============================================================================
# CHECKPOINT SETTINGS
# =============================================================================

# Checkpoint settings
checkpoint_completion_target = 0.7
wal_buffers = 16MB
checkpoint_timeout = 15min
max_wal_size = 1GB
min_wal_size = 256MB

# =============================================================================
# TIME ZONE
# =============================================================================

timezone = 'UTC'
log_timezone = 'UTC'

# =============================================================================
# DEVELOPMENT SPECIFIC SETTINGS
# =============================================================================

# Enable query planning debugging (dev only)
log_planner_stats = off
log_executor_stats = off
log_statement_stats = off

# Development friendly settings
fsync = off                         # DANGER: Only for development!
synchronous_commit = off            # DANGER: Only for development!
full_page_writes = off              # DANGER: Only for development!

# Allow larger objects for development
temp_file_limit = 10GB

# =============================================================================
# LOCALE SETTINGS
# =============================================================================

datestyle = 'iso, mdy'
intervalstyle = 'postgres'
default_text_search_config = 'pg_catalog.english' 
# PostgreSQL configuration for Calvin AI Production Environment
# Optimized for TimescaleDB and time-series trading data

# =============================================================================
# CONNECTION AND AUTHENTICATION
# =============================================================================

listen_addresses = '*'
port = 5432
max_connections = 200

# Authentication
ssl = off
# ssl_cert_file = '/var/lib/postgresql/server.crt'
# ssl_key_file = '/var/lib/postgresql/server.key'
password_encryption = md5

# =============================================================================
# MEMORY SETTINGS (Production - 4GB container)
# =============================================================================

# Memory allocation (optimized for production)
shared_buffers = 1GB                # 25% of available RAM (4GB container)
effective_cache_size = 3GB          # 75% of available RAM
work_mem = 32MB                     # Per operation memory (higher for complex queries)
maintenance_work_mem = 512MB        # For maintenance operations

# =============================================================================
# TIMESCALEDB SETTINGS
# =============================================================================

# Enable TimescaleDB extension
shared_preload_libraries = 'timescaledb'

# TimescaleDB specific settings (production)
timescaledb.max_background_workers = 8
max_worker_processes = 16
max_parallel_workers = 8
max_parallel_workers_per_gather = 4

# =============================================================================
# WRITE AHEAD LOG (WAL) SETTINGS
# =============================================================================

# WAL settings for production
wal_level = replica
max_wal_senders = 5
wal_keep_size = 1GB
hot_standby = on

# WAL archiving (enabled for production backup)
archive_mode = on
archive_command = 'test ! -f /backup/archive/%f && cp %p /backup/archive/%f'
archive_timeout = 1800              # Archive every 30 minutes

# =============================================================================
# QUERY PERFORMANCE
# =============================================================================

# Query performance tuning (production)
random_page_cost = 1.1              # SSD storage assumption
effective_io_concurrency = 200      # Concurrent I/O operations
seq_page_cost = 1.0

# Planner settings
default_statistics_target = 100
constraint_exclusion = partition

# =============================================================================
# LOGGING (Production - Less verbose)
# =============================================================================

# Logging configuration
log_destination = 'stderr'
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# What to log (production settings)
log_line_prefix = '%m [%p] %q%u@%d '
log_checkpoints = on
log_connections = off               # Disabled for production (too verbose)
log_disconnections = off            # Disabled for production
log_lock_waits = on
log_statement = 'ddl'               # Only log DDL statements
log_temp_files = 100MB              # Only log large temp files

# Log slow queries (anything over 5 seconds)
log_min_duration_statement = 5000

# =============================================================================
# AUTOVACUUM SETTINGS (Production)
# =============================================================================

# Autovacuum tuning for time-series data (production)
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 15s            # More frequent for high-volume data

# Vacuum settings (production)
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 5ms
autovacuum_vacuum_cost_limit = 2000

# =============================================================================
# CHECKPOINT SETTINGS (Production)
# =============================================================================

# Checkpoint settings (production)
checkpoint_completion_target = 0.9
wal_buffers = 64MB                  # Larger for production
checkpoint_timeout = 30min          # Longer for production
max_wal_size = 4GB                  # Larger for production
min_wal_size = 1GB

# =============================================================================
# TIME ZONE
# =============================================================================

timezone = 'UTC'
log_timezone = 'UTC'

# =============================================================================
# PRODUCTION SPECIFIC SETTINGS
# =============================================================================

# Production safety settings
fsync = on                          # REQUIRED for production!
synchronous_commit = on             # REQUIRED for production!
full_page_writes = on               # REQUIRED for production!

# Statement timeout (prevent runaway queries)
statement_timeout = 300000          # 5 minutes
lock_timeout = 30000                # 30 seconds
idle_in_transaction_session_timeout = 600000  # 10 minutes

# Larger temp file limit for production analytics
temp_file_limit = 5GB

# =============================================================================
# LOCALE SETTINGS
# =============================================================================

datestyle = 'iso, mdy'
intervalstyle = 'postgres'
default_text_search_config = 'pg_catalog.english'

# =============================================================================
# SECURITY SETTINGS
# =============================================================================

# Enhanced security for production
log_statement = 'ddl'
log_hostname = on
track_activities = on
track_counts = on
track_io_timing = on
track_functions = 'all' 
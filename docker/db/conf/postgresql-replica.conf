# PostgreSQL Replica Configuration for Calvin AI
# Optimized for read-only operations and replication

# Connection Settings
listen_addresses = '*'
port = 5432
max_connections = 100                    # Lower for read-only replica
superuser_reserved_connections = 3

# Memory Settings (optimized for read workload)
shared_buffers = 512MB                   # Smaller for replica
effective_cache_size = 1.5GB            # Adjusted for 2GB container limit
work_mem = 8MB                          # Smaller for read operations
maintenance_work_mem = 128MB
autovacuum_work_mem = 128MB

# TimescaleDB specific settings
shared_preload_libraries = 'timescaledb'
max_worker_processes = 4                # Fewer workers for replica
max_parallel_workers_per_gather = 2
max_parallel_workers = 4
max_parallel_maintenance_workers = 2

# WAL settings for standby
wal_level = replica
hot_standby = on
max_standby_archive_delay = 30s
max_standby_streaming_delay = 30s
wal_receiver_status_interval = 10s
hot_standby_feedback = on

# Logging (less verbose for replica)
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-replica-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 50MB
log_min_duration_statement = 5000       # Only log very slow queries
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_connections = off                   # Reduce log volume
log_disconnections = off

# Query tuning (read-optimized)
random_page_cost = 1.0                  # SSD optimized, slightly lower for reads
seq_page_cost = 1.0
cpu_tuple_cost = 0.01
cpu_index_tuple_cost = 0.005
cpu_operator_cost = 0.0025

# Background processes (minimal for replica)
autovacuum = off                        # Disabled on replica
wal_buffers = 8MB                      # Smaller for replica

# Security
ssl = off
password_encryption = md5

# TimescaleDB chunk settings (read-only)
timescaledb.max_background_workers = 4 
version: '3.8'

services:
  # TimescaleDB (PostgreSQL with time-series extension)
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: calvin-timescaledb-dev
    environment:
      POSTGRES_DB: calvin_trading_dev
      POSTGRES_USER: calvin_dev
      POSTGRES_PASSWORD: ${DB_PASSWORD_DEV:-calvin_dev_password}
      POSTGRES_HOST_AUTH_METHOD: trust
      # TimescaleDB specific
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "5433:5432"
    volumes:
      - timescale_dev_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
      - ./db/conf/postgresql-dev.conf:/etc/postgresql/postgresql.conf
    command: >
      postgres 
      -c config_file=/etc/postgresql/postgresql.conf
      -c shared_preload_libraries=timescaledb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calvin_dev -d calvin_trading_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - calvin-dev-network
    restart: unless-stopped

  # Redis for caching and pub/sub
  redis:
    image: redis:7.2-alpine
    container_name: calvin-redis-dev
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD_DEV:-calvin_redis_dev_secure_456}
    ports:
      - "6379:6379"
    volumes:
      - redis_dev_data:/data
      - ./redis/redis-dev.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - calvin-dev-network
    restart: unless-stopped

  # PgBouncer for connection pooling
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: calvin-pgbouncer-dev
    entrypoint: ["/opt/pgbouncer/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    environment:
      # Required to satisfy entrypoint script check
      DATABASES_HOST: timescaledb
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer-dev.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "psql -h localhost -p 6432 -U calvin_dev -d calvin_trading_dev -c 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - calvin-dev-network
    restart: unless-stopped

  # Database admin tool (optional - for development)
  adminer:
    image: adminer:latest
    container_name: calvin-adminer-dev
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: timescaledb
    depends_on:
      timescaledb:
        condition: service_healthy
    networks:
      - calvin-dev-network
    profiles:
      - admin  # Only start with: docker-compose --profile admin up

volumes:
  timescale_dev_data:
    driver: local
  redis_dev_data:
    driver: local

networks:
  calvin-dev-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16 
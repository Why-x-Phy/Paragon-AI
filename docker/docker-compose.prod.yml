version: '3.8'

services:
  # TimescaleDB (PostgreSQL with time-series extension) - Production
  timescaledb:
    image: timescale/timescaledb:latest-pg15
    container_name: calvin-timescaledb-prod
    environment:
      POSTGRES_DB: calvin_trading
      POSTGRES_USER: calvin_prod
      POSTGRES_PASSWORD: ${DB_PASSWORD_PROD}
      POSTGRES_HOST_AUTH_METHOD: md5
      # TimescaleDB specific
      TIMESCALEDB_TELEMETRY: "off"
    ports:
      - "5433:5432"
    volumes:
      - timescale_prod_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
      - ./db/conf/postgresql-prod.conf:/etc/postgresql/postgresql.conf
      - ./db/backup:/backup
    command: >
      postgres 
      -c config_file=/etc/postgresql/postgresql.conf
      -c shared_preload_libraries=timescaledb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calvin_prod -d calvin_trading"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 60s
    networks:
      - calvin-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"

  # Redis for caching and pub/sub - Production
  redis:
    image: redis:7.2-alpine
    container_name: calvin-redis-prod
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD_PROD}
    ports:
      - "6379:6379"
    volumes:
      - redis_prod_data:/data
      - ./redis/redis-prod.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "auth", "${REDIS_PASSWORD_PROD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - calvin-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
        reservations:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PgBouncer for connection pooling - Production
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: calvin-pgbouncer-prod
    entrypoint: ["/opt/pgbouncer/pgbouncer", "/etc/pgbouncer/pgbouncer.ini"]
    environment:
      # Required to satisfy entrypoint script check
      DATABASES_HOST: timescaledb
    ports:
      - "6432:6432"
    volumes:
      - ./pgbouncer/pgbouncer-prod.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    depends_on:
      timescaledb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "psql -h localhost -p 6432 -U calvin_prod -d calvin_trading -c 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - calvin-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
        reservations:
          memory: 256M
          cpus: '0.25'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # Monitoring - Prometheus (optional)
  prometheus:
    image: prom/prometheus:latest
    container_name: calvin-prometheus-prod
    ports:
      - "0.0.0.0:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
      - '--web.external-url=http://172.31.31.43:9090'
    networks:
      - calvin-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - monitoring

  # Monitoring - Grafana (optional)
  grafana:
    image: grafana/grafana:latest
    container_name: calvin-grafana-prod
    ports:
      - "0.0.0.0:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: false
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel,grafana-simple-json-datasource
      GF_SERVER_ROOT_URL: http://172.31.31.43:3000
      GF_SERVER_SERVE_FROM_SUB_PATH: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - calvin-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    profiles:
      - monitoring

volumes:
  # Production volumes with better backup strategy
  timescale_prod_data:
    driver: local
    name: calvin_timescale_prod_data
  redis_prod_data:
    driver: local
    name: calvin_redis_prod_data
  prometheus_data:
    driver: local
    name: calvin_prometheus_data
  grafana_data:
    driver: local
    name: calvin_grafana_data

networks:
  calvin-prod-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
    driver_opts:
      com.docker.network.bridge.name: calvin-prod
      com.docker.network.bridge.enable_ip_masquerade: 'true'
      com.docker.network.bridge.enable_icc: 'true' 
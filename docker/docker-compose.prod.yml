version: '3.8'

services:
  # TimescaleDB Primary (Master)
  timescaledb-primary:
    image: timescale/timescaledb:latest-pg15
    container_name: calvin-timescaledb-primary
    environment:
      POSTGRES_DB: calvin_trading
      POSTGRES_USER: calvin_prod
      POSTGRES_PASSWORD: ${DB_PASSWORD_PROD}
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: md5
      # TimescaleDB specific
      TIMESCALEDB_TELEMETRY: off
    volumes:
      - timescale_primary_data:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d
      - ./db/conf/postgresql-primary.conf:/etc/postgresql/postgresql.conf
      - ./db/backup:/backup
    command: >
      postgres 
      -c config_file=/etc/postgresql/postgresql.conf
      -c shared_preload_libraries=timescaledb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U calvin_prod -d calvin_trading"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - calvin-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: '2.0'
        reservations:
          memory: 2G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # TimescaleDB Replica (Read-only)
  timescaledb-replica:
    image: timescale/timescaledb:latest-pg15
    container_name: calvin-timescaledb-replica
    environment:
      POSTGRES_DB: calvin_trading
      POSTGRES_USER: calvin_prod
      POSTGRES_PASSWORD: ${DB_PASSWORD_PROD}
      POSTGRES_PRIMARY_HOST: timescaledb-primary
      POSTGRES_REPLICATION_USER: replicator
      POSTGRES_REPLICATION_PASSWORD: ${REPLICATION_PASSWORD}
      PGUSER: postgres
    volumes:
      - timescale_replica_data:/var/lib/postgresql/data
      - ./db/conf/postgresql-replica.conf:/etc/postgresql/postgresql.conf
    command: >
      bash -c "
      until pg_isready -h timescaledb-primary -p 5432 -U calvin_prod; do
        echo 'Waiting for primary to be ready...'
        sleep 5
      done
      echo 'Setting up replica...'
      pg_basebackup -h timescaledb-primary -D /var/lib/postgresql/data -U replicator -v -P -W
      echo 'standby_mode = on' >> /var/lib/postgresql/data/recovery.conf
      echo 'primary_conninfo = host=timescaledb-primary port=5432 user=replicator' >> /var/lib/postgresql/data/recovery.conf
      postgres -c config_file=/etc/postgresql/postgresql.conf
      "
    depends_on:
      timescaledb-primary:
        condition: service_healthy
    networks:
      - calvin-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # Redis Cluster
  redis-master:
    image: redis:7.2-alpine
    container_name: calvin-redis-master
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_master_data:/data
      - ./redis/redis-prod.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "auth", "${REDIS_PASSWORD}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - calvin-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # PgBouncer for connection pooling
  pgbouncer:
    image: pgbouncer/pgbouncer:latest
    container_name: calvin-pgbouncer-prod
    environment:
      DATABASES_HOST: timescaledb-primary
      DATABASES_PORT: 5432
      DATABASES_USER: calvin_prod
      DATABASES_PASSWORD: ${DB_PASSWORD_PROD}
      DATABASES_DBNAME: calvin_trading
      POOL_MODE: transaction
      MAX_CLIENT_CONN: 200
      DEFAULT_POOL_SIZE: 50
      RESERVE_POOL_SIZE: 10
      SERVER_RESET_QUERY: DISCARD ALL
      IGNORE_STARTUP_PARAMETERS: extra_float_digits
      # Security
      ADMIN_USERS: ${PGBOUNCER_ADMIN_USER:-admin}
      STATS_USERS: ${PGBOUNCER_STATS_USER:-stats}
    volumes:
      - ./pgbouncer/pgbouncer-prod.ini:/etc/pgbouncer/pgbouncer.ini
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt
    depends_on:
      timescaledb-primary:
        condition: service_healthy
    networks:
      - calvin-prod-network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "3"

  # Monitoring - Prometheus for metrics collection
  prometheus:
    image: prom/prometheus:latest
    container_name: calvin-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    networks:
      - calvin-prod-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Monitoring - Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: calvin-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    networks:
      - calvin-prod-network
    restart: unless-stopped
    profiles:
      - monitoring

  # Log aggregation - Loki
  loki:
    image: grafana/loki:latest
    container_name: calvin-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki-config.yml:/etc/loki/local-config.yaml
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - calvin-prod-network
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  timescale_primary_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/calvin/data/timescale-primary
  timescale_replica_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/calvin/data/timescale-replica
  redis_master_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/calvin/data/redis
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  loki_data:
    driver: local

networks:
  calvin-prod-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
    driver_opts:
      com.docker.network.bridge.name: calvin-prod
      com.docker.network.bridge.enable_ip_masquerade: 'true'
      com.docker.network.bridge.enable_icc: 'true' 
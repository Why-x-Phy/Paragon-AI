apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: true
    basicAuth: false
    jsonData:
      httpMethod: POST
      prometheusType: Prometheus
      prometheusVersion: 2.40.0
      cacheLevel: 'High'
      disableRecordingRules: false
      incrementalQueryOverlapWindow: 10m

  - name: Calvin-TimescaleDB
    type: postgres
    access: proxy
    url: timescaledb-primary:5432
    database: calvin_trading
    user: calvin_prod
    secureJsonData:
      password: ${DB_PASSWORD_PROD}
    jsonData:
      sslmode: disable
      postgresVersion: 1500
      timescaledb: true
    editable: true 
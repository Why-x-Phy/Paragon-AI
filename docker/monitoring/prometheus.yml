global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # The job name is added as a label `job=<job_name>` to any timeseries scraped from this config.
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # TimescaleDB monitoring (if postgres_exporter is added)
  - job_name: 'calvin-timescaledb'
    static_configs:
      - targets: ['timescaledb-primary:5432']
    metrics_path: /metrics
    scrape_interval: 30s

  # Redis monitoring (if redis_exporter is added)  
  - job_name: 'calvin-redis'
    static_configs:
      - targets: ['redis-master:6379']
    metrics_path: /metrics
    scrape_interval: 30s

  # Application metrics (when Calvin AI adds metrics endpoint)
  - job_name: 'calvin-app'
    static_configs:
      - targets: ['host.docker.internal:8000']  # Adjust port as needed
    metrics_path: /metrics
    scrape_interval: 10s
    scrape_timeout: 5s

  # Docker container metrics (if cAdvisor is added)
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    metrics_path: /metrics
    scrape_interval: 30s 
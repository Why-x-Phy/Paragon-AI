#pgbouncer.ini

[databases]
calvin_trading_dev = host=timescaledb port=5432 dbname=calvin_trading_dev

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 100
default_pool_size = 25
reserve_pool_size = 5
server_reset_query = DISCARD ALL
ignore_startup_parameters = extra_float_digits
admin_users = admin
stats_users = stats

# Connection timeouts
server_idle_timeout = 600
server_lifetime = 3600
server_connect_timeout = 15
server_login_retry = 15

# Log settings
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1

# Security - trust for development only
# In production, use scram-sha-256 with proper certificates

# TLS settings

# Dangerous timeouts


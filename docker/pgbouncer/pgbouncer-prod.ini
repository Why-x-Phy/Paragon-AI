# PgBouncer configuration for Calvin AI Production Environment
# Connection pooling for TimescaleDB

[databases]
calvin_trading = host=timescaledb port=5432 dbname=calvin_trading user=calvin_prod

[pgbouncer]
# Connection settings
pool_mode = transaction
listen_port = 6432
listen_addr = *
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

# Logging
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 60

# Authentication
admin_users = admin
stats_users = stats

# Connection limits (production settings)
max_client_conn = 200
default_pool_size = 50
min_pool_size = 10
reserve_pool_size = 20
max_db_connections = 180

# Server settings
server_reset_query = DISCARD ALL
server_check_delay = 30
server_check_query = SELECT 1
server_lifetime = 3600
server_idle_timeout = 600

# Client settings
client_idle_timeout = 0
client_login_timeout = 60

# Console access
unix_socket_dir = /tmp
unix_socket_mode = 0777

# DNS settings
dns_max_ttl = 15
dns_nxdomain_ttl = 15

# Security
ignore_startup_parameters = extra_float_digits,search_path

# Performance
application_name_add_host = 1
query_timeout = 0
query_wait_timeout = 120
cancel_wait_timeout = 10

# TCP settings
tcp_defer_accept = 0
tcp_socket_buffer = 0
tcp_keepalive = 1
tcp_keepcnt = 0
tcp_keepidle = 0
tcp_keepintvl = 0

# Verbose logging for production monitoring
verbose = 1 
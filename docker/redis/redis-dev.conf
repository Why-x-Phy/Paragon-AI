# Redis configuration for Calvin AI Development Environment
# Optimized for real-time price data caching and pub/sub

# =============================================================================
# NETWORK AND SECURITY
# =============================================================================

# Bind to all interfaces (container environment)
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300

# Security (basic for development)
requirepass calvin_redis_dev_secure_456

# =============================================================================
# MEMORY MANAGEMENT
# =============================================================================

# Memory limit for development (256MB)
maxmemory 256mb
maxmemory-policy allkeys-lru

# Memory optimization
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# =============================================================================
# PERSISTENCE
# =============================================================================

# RDB snapshots (periodic saves)
# Save after 900 seconds if at least 1 key changed
save 900 1
# Save after 300 seconds if at least 10 keys changed  
save 300 10
# Save after 60 seconds if at least 10000 keys changed
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# AOF (Append Only File) - for better durability
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# =============================================================================
# PERFORMANCE TUNING
# =============================================================================

# TCP settings
tcp-backlog 511
tcp-keepalive 300

# Database settings
databases 16

# Lazy freeing for better performance
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# =============================================================================
# LOGGING
# =============================================================================

# Log level for development
loglevel notice
logfile ""

# =============================================================================
# CLIENT SETTINGS
# =============================================================================

# Connection limits
maxclients 10000

# Client output buffer limits
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# =============================================================================
# DEVELOPMENT SPECIFIC SETTINGS
# =============================================================================

# Enable keyspace notifications for debugging
notify-keyspace-events "Ex"

# Disable protected mode for development
protected-mode no

# Slower timeout for development debugging
timeout 300

# =============================================================================
# CALVIN AI SPECIFIC SETTINGS
# =============================================================================

# Key expiration for price data (5 minutes default)
# These will be set by the application, but documented here

# Example key patterns and TTLs:
# prices:SOL:current -> 300 seconds (5 minutes)
# ohlcv:SOL:1m:recent -> 3600 seconds (1 hour)
# positions:active -> no expiration
# websocket:health -> 60 seconds
# model:predictions -> 7200 seconds (2 hours) 
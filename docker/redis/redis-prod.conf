# Redis Production Configuration for Calvin AI
# Optimized for high-performance trading data caching

# Network
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300

# Security
# Password will be set via environment variable
requirepass AppCherry1926

# Memory management (2GB for production)
maxmemory 2gb
maxmemory-policy allkeys-lru

# Persistence (production settings)
save 900 1      
save 300 10       
save 60 10000   
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Performance optimizations
databases 16
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Connection settings (production)
tcp-backlog 511
tcp-keepalive 300
timeout 0

# Logging (production)
loglevel notice
logfile ""
syslog-enabled no

# Client settings (production)
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
maxclients 10000

# Advanced settings for trading workload
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Memory optimization
activerehashing yes
stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes

# Disable dangerous commands in production (but keep EVAL for Calvin AI)
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command CONFIG "CONFIG_calvin_ai_only"
rename-command DEBUG ""
rename-command SHUTDOWN "SHUTDOWN_calvin_ai_only"

# Production monitoring
latency-monitor-threshold 100 
# Redis Production Configuration for Calvin AI
# Optimized for high-performance trading data caching

# Network
bind 0.0.0.0
port 6379
timeout 0
tcp-keepalive 300

# Security
# Password will be set via environment variable
requirepass ${REDIS_PASSWORD_DEV:-calvin_redis_dev_secure_456}

# Memory management (2GB for production)
maxmemory 2gb
maxmemory-policy allkeys-lru

# Persistence
save 900 1      # Save snapshot if at least 1 key changes in 900 seconds
save 300 10     # Save snapshot if at least 10 keys change in 300 seconds  
save 60 10000   # Save snapshot if at least 10000 keys change in 60 seconds
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec

# Performance optimizations
databases 16
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

# Logging
loglevel notice
logfile ""

# Client settings
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Advanced settings for trading workload
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Disable dangerous commands in production
rename-command FLUSHDB ""
rename-command FLUSHALL ""
rename-command EVAL ""
rename-command DEBUG "" 
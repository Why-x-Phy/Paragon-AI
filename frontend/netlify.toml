[build]
  base = "frontend/"
  publish = "frontend/out"
  command = "npm run build && npm run export"

[build.environment]
  NODE_VERSION = "18"
  NPM_VERSION = "8"

# Subdomain configuration
[[redirects]]
  from = "https://vault.cabalcalvin.com/*"
  to = "https://vault.cabalcalvin.com/:splat"
  status = 200
  force = true

# SPA fallback for Next.js routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https:; style-src 'self' 'unsafe-inline' https:; img-src 'self' data: https:; connect-src 'self' https: wss:; font-src 'self' https:;"

# Discord OAuth callback
[[redirects]]
  from = "/api/auth/*"
  to = "/.netlify/functions/auth/:splat"
  status = 200

# Environment-specific redirects for production
[context.production.environment]
  NEXTAUTH_URL = "https://vault.cabalcalvin.com"

[context.deploy-preview.environment]
  NEXTAUTH_URL = "https://deploy-preview-ID--vault-cabalcalvin.netlify.app"

# Branch-specific settings for staging
[context.staging.environment]
  NEXTAUTH_URL = "https://staging--vault-cabalcalvin.netlify.app" 
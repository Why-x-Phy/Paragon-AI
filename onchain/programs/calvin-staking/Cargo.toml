[package]
name = "calvin-staking"
version = "0.1.0"
description = "Calvin Staking Program - Manages CALVIN token staking and Vault Pass distribution"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "calvin_staking"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"

[profile.release]
# Stack optimization for Solana programs
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false

[profile.dev]
# Debug profile with stack optimization
opt-level = 1
debug = true
panic = "abort"

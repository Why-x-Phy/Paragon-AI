[package]
name = "calvin-vault"
version = "0.1.0"
description = "Calvin Vault Program - AI-powered trading vault with tiered access"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "calvin_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
default = []

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
pyth-sdk-solana = "0.10.5"
switchboard-on-demand = "0.3.8"

[profile.release]
# Stack optimization for Solana programs
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = false

[profile.dev]
# Debug profile with stack optimization
opt-level = 1
debug = true
panic = "abort"